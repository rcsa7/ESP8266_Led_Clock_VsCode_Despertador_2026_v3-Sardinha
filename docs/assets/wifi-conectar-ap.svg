<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Conectar à rede RelogioLED-AP</title>
  <desc id="desc">Ilustração de um celular selecionando a rede temporária do relógio e usando a senha password.</desc>
  <rect width="900" height="500" fill="#f3f7f5"/>
  <rect x="55" y="55" width="355" height="390" rx="28" fill="#17231f"/>
  <rect x="72" y="92" width="321" height="326" rx="10" fill="#ffffff"/>
  <text x="96" y="135" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17231f">Redes Wi-Fi</text>
  <rect x="92" y="170" width="280" height="82" rx="8" fill="#dff3e8" stroke="#25835b" stroke-width="3"/>
  <path d="M120 204 Q142 183 164 204 M128 214 Q142 201 156 214 M138 225 Q142 221 146 225" fill="none" stroke="#25835b" stroke-width="5" stroke-linecap="round"/>
  <text x="181" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17231f">RelogioLED-AP</text>
  <text x="181" y="234" font-family="Arial, sans-serif" font-size="15" fill="#486158">Protegida</text>
  <text x="96" y="294" font-family="Arial, sans-serif" font-size="16" fill="#486158">Senha da rede temporária</text>
  <rect x="92" y="310" width="280" height="50" rx="7" fill="#fff" stroke="#91a69e" stroke-width="2"/>
  <text x="112" y="343" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#17231f">password</text>
  <rect x="470" y="108" width="365" height="282" rx="10" fill="#ffffff" stroke="#d6e1dc" stroke-width="2"/>
  <circle cx="522" cy="165" r="23" fill="#25835b"/>
  <text x="514" y="173" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">1</text>
  <text x="565" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17231f">Selecione a rede</text>
  <circle cx="522" cy="246" r="23" fill="#25835b"/>
  <text x="514" y="254" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">2</text>
  <text x="565" y="253" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17231f">Digite a senha</text>
  <circle cx="522" cy="327" r="23" fill="#25835b"/>
  <text x="514" y="335" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">3</text>
  <text x="565" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17231f">Permaneça conectado</text>
  <text x="565" y="346" font-family="Arial, sans-serif" font-size="16" fill="#486158">mesmo com “Sem internet”</text>
</svg>