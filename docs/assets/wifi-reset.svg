<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Reset para trocar a rede Wi-Fi</title>
  <desc id="desc">Botão D4 pressionado por cinco segundos até o display mostrar RESET.</desc>
  <rect width="900" height="470" fill="#f5f3f0"/>
  <rect x="80" y="105" width="475" height="250" rx="18" fill="#263038"/>
  <rect x="118" y="155" width="305" height="95" rx="6" fill="#0c1513" stroke="#53635e" stroke-width="3"/>
  <text x="270" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="700" fill="#ef4e3e">RESET</text>
  <circle cx="485" cy="202" r="28" fill="#ef4e3e" stroke="#fff" stroke-width="4"/>
  <text x="485" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">D4 / GPIO2</text>
  <path d="M485 78 v77" stroke="#17231f" stroke-width="8" stroke-linecap="round"/>
  <path d="M468 135 l17 22 17-22" fill="none" stroke="#17231f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="697" cy="192" r="100" fill="#fff" stroke="#d8cec1" stroke-width="3"/>
  <path d="M697 122 v75 l50 28" fill="none" stroke="#287a5a" stroke-width="10" stroke-linecap="round"/>
  <text x="697" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17231f">Segure 5 segundos</text>
  <text x="450" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#684a40">Aguarde aparecer RESET antes de soltar o botão.</text>
</svg>